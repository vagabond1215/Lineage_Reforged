/* Review refinement: compact left rail, actual visible resource bars and marginal taxonomy. */
.railnav{margin:0 0 14px}
.railhr{margin:11px 0 13px}
.who{margin:0 0 13px}
.resources{display:grid;grid-template-columns:1fr;gap:9px;margin:0 0 16px}
.resbar{min-width:0}
.resbar-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;color:#c8c4b8;font-size:10px;font-weight:700;letter-spacing:.11em}
.resbar-head strong{color:#e9ddc7;font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
.resbar-track{height:7px;border:1px solid #485158;background:#0d141a;border-radius:999px;overflow:hidden}
.resbar-fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9f534d,#d57d6f)}
.resbar.mp .resbar-fill{background:linear-gradient(90deg,#476c94,#80acda)}
.resbar.stamina .resbar-fill{background:linear-gradient(90deg,#7c8860,#aebe88)}
.statgroups{display:grid;gap:0}
.statgroup{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:stretch;border-top:1px solid #424746;padding:9px 0 10px;min-height:75px}
.statgroup:last-child{border-bottom:1px solid #424746}
.grouplabel{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.16em;font-size:10px;color:#c4aa80;text-transform:uppercase;font-weight:750;border:0;margin:0;padding:1px 0}
.groupvalues{border-left:1px solid #394247;padding-left:12px;display:grid;align-content:center;gap:2px}
.statline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:1px 3px;margin:0;color:#c4c7c6}
.statline span{font-weight:600;color:#a9b4b9;font-size:11px}
.statline strong{font-size:13px;font-variant-numeric:tabular-nums;color:#eee1ca}
/* Identity's selected rail step already identifies the active view. */
.content.identity-stage{padding-top:22px}
.content.identity-stage>.heading,.content.identity-stage>.hline{display:none}
.portraitfoot h3{margin-bottom:10px}
.portraitfoot .outlinebtn{margin-top:8px}
@media(max-width:550px){
  .railstat{display:block}
  .railnav{margin:9px 0 11px}
  .statgroup{grid-template-columns:40px minmax(0,1fr)}
  .resources{gap:8px}
}

/* Keep all nine sidebar attributes visible on a typical laptop height. */
@media (min-width:551px){
 .railinner{padding-top:14px;padding-bottom:12px}
 .navbtn{min-height:36px}
 .railnav{gap:4px;margin-bottom:11px}
 .railhr{margin:9px 0 11px}
 .who{font-size:23px;margin-bottom:9px}
 .resources{gap:7px;margin-bottom:12px}
 .resbar-head{margin-bottom:3px}
 .statgroup{min-height:67px;padding:7px 0}
}

/* Restore the two-tier AppShell chrome: brand corner, top controls, separate contextual sub-bar. */
:root{--creator-rail-width:266px}
.chrome{display:grid;grid-template-columns:var(--creator-rail-width) minmax(0,1fr);grid-template-rows:auto auto;position:sticky;top:0;z-index:30;box-shadow:0 5px 16px #090d1233}
.brandwell{grid-column:1;grid-row:1/3;min-width:0;background:#141b20;border-right:1px solid #3e4446;border-bottom:1px solid #475052}
.brandwell .brand{min-height:100%;padding:18px;display:flex;align-items:center}
.chrome .top{grid-column:2;grid-row:1;min-height:72px;justify-content:flex-end;position:relative;top:auto;z-index:auto;border-bottom:1px solid #363f42}
.chrome .mobilebrand{display:none}
.chrome .subbar{grid-column:2;grid-row:2;display:flex;align-items:center;gap:18px;min-height:44px;padding:8px 26px;background:#1b252a;border-bottom:1px solid #475052;min-width:0}
.chrome .crumbs{margin:0;display:flex;flex:1;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:auto;scrollbar-width:none;letter-spacing:.035em}
.chrome .crumbs::-webkit-scrollbar{display:none}
.chrome .crumbs strong{color:#f1dfc3;font-weight:650}
.chrome .substatus{flex-shrink:0;margin-left:auto;color:#aeb8b7;font-size:10px;letter-spacing:.02em}

/* Palette shades are ordered from top-left down through each color family and onward
   to the bottom-right. Fixed cells and equal row/column gaps avoid loose horizontal spacing. */
.palette-grid{--swatch-size:31px;--swatch-gap:8px;--palette-rows:4;
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--palette-rows),var(--swatch-size));

  border:2px solid #657377;box-shadow:inset 0 0 0 1px #21272b;border-radius:50%;
  transition:border-color .12s,transform .12s}

const paletteCache={};
function hexToRgb(hex){const s=String(hex||'').replace('#','').trim();if(s.length!==6)return null;const n=parseInt(s,16);if(Number.isNaN(n))return null;return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0,s=0,l=(max+min)/2;if(d){s=d/(1-Math.abs(2*l-1));switch(max){case r:h=60*(((g-b)/d)%6);break;case g:h=60*(((b-r)/d)+2);break;default:h=60*(((r-g)/d)+4);}if(h<0)h+=360;}return {h,s,l};}
function paletteHueBucket(h,s){if(s<0.06)return 8;if(h<18||h>=338)return 0;if(h<45)return 1;if(h<78)return 2;if(h<165)return 3;if(h<205)return 4;if(h<255)return 5;if(h<320)return 6;return 7;}
function paletteSortForDisplay(options,key){return [...options].sort((a,b)=>{const ra=hexToRgb(a.hex)||{r:128,g:128,b:128},rb=hexToRgb(b.hex)||{r:128,g:128,b:128};const ca=rgbToHsl(ra.r,ra.g,ra.b),cb=rgbToHsl(rb.r,rb.g,rb.b);const ba=paletteHueBucket(ca.h,ca.s),bb=paletteHueBucket(cb.h,cb.s);if(ba!==bb)return ba-bb;if(Math.abs(ca.s-cb.s)>0.015)return ca.s-cb.s;if(Math.abs(ca.l-cb.l)>0.015)return cb.l-ca.l;return a.name.localeCompare(b.name);});}

function weightedAllocate(amount,weights){
 const out=emptyPoints();if(!amount)return out;
 const all=Object.entries(weights),total=all.reduce((s,[,w])=>s+w,0);
 const entries=all.map(([key,weight],order)=>({key,order,raw:amount*weight/total}));
 for(const entry of entries)out[entry.key]=Math.floor(entry.raw);
 let rest=amount-entries.reduce((s,e)=>s+out[e.key],0);
 for(const entry of [...entries].sort((a,b)=>(b.raw%1)-(a.raw%1)||a.order-b.order)){if(rest<=0)break;out[entry.key]++;rest--}
 return out;
}

 for(const k of ATTRIBUTE_KEYS){physicalBonus[k]=power[k]+prowess[k];bonus[k]=physicalBonus[k]+mind[k];}
 return {power,prowess,mind,physicalBonus,bonus,physical,mindCount,powerCount,prowessCount};
}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.launch){navigateLauncher(b.dataset.launch,b);return;}if(b.dataset.nav!==undefined)return nav(Number(b.dataset.nav));if(b.dataset.pick){const k=b.dataset.pick,v=b.dataset.value;if(k==='lineage')selectLineage(v);else selectGeo(k,v);return}/* Color selection is cosmetic: preserve World Entry, Summary review and the first decision. */if(b.dataset.color){state[b.dataset.color]=Number(b.dataset.index);state.portrait=false;return render()}if(b.dataset.conditionToggle){const group=b.dataset.group,id=b.dataset.conditionToggle,selected=state.selectedConditions[group];if(!conditions[group]?.some(c=>c.id===id))return;state.selectedConditions[group]=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];const inspector=group==='negative'?'inspectedNegative':'inspectedPositive';state[inspector]=state.selectedConditions[group].includes(id)?id:(state.selectedConditions[group].at(-1)||null);invalidateOpening();render();return}if(b.dataset.profile){state[b.dataset.profile]=b.dataset.choiceValue;state.validation=false;invalidateOpening();return render()}if(b.dataset.sex){state.sex=b.dataset.sex;invalidateOpening();return render()}if(b.dataset.pool){state.pool=b.dataset.pool;state.scenario=null;invalidateOpening();return render()}if(b.dataset.story){return story(b.dataset.story)}if(b.dataset.entryChoice){return chooseOpening(b.dataset.entryChoice)}if(b.id==='creatorBack'){if(state.stage>0)return nav(state.stage-1);return navigateLauncher('characters',b)}if(b.id==='detailsToggle'){state.showAttributeDetails=!state.showAttributeDetails;return render()}if(b.id==='resetEntryChoice'){state.entryChoice=null;return render()}if(b.id==='backSummary')return nav(6);if(b.id==='nextTop'||b.id==='next')return next();if(b.id==='nameDice')return randomName();if(b.id==='identityDice')return randomIdentity();if(b.id==='generate')return portraitPrompt();if(b.id==='dialogClose'||b.id==='closeContinuation')return el('dialogbg').classList.remove('open');if(b.id==='copyPrompt'){const text=el('promptText')?.textContent||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>{b.textContent='Copied'}).catch(()=>{b.textContent='Select text to copy'});return}if(b.id==='mobileToggle'){const open=el('railCollapse').classList.toggle('open');b.setAttribute('aria-expanded',String(open));return}if(b.id==='themeBtn'){const bright=document.documentElement.classList.toggle('preview-brighter');b.textContent=bright?'Use original brightness':'Increase display brightness';return;}});
document.addEventListener('change',e=>{const fld=e.target.dataset.field;if(fld){state[fld]=e.target.value;invalidateOpening();render()}});
document.addEventListener('input',e=>{
 if(e.target.id==='previewWorldName'){route.worldDraft=e.target.value;return;}
 if(e.target.id==='firstName'||e.target.id==='lastName'){
  state[e.target.id]=e.target.value;syncName();invalidateOpening();state.validation=false;
  renderRail();
  document.querySelectorAll('[data-narrative]').forEach(node=>{node.textContent=narrativeFor(node.dataset.narrative)});
  const caption=el('portraitCaption');if(caption)caption.textContent=summarySentence();
  const heading=document.querySelector('.portraitfoot h3');if(heading)heading.textContent=fullName()||'Unnamed Wanderer';
  const notice=document.querySelector('.validation');if(notice)notice.classList.remove('show');
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')el('dialogbg').classList.remove('open')});
el('dialogbg').addEventListener('click',e=>{if(e.target===el('dialogbg'))el('dialogbg').classList.remove('open')});
if(window.matchMedia('(max-width:550px)').matches){el('railCollapse').classList.remove('open');el('mobileToggle').setAttribute('aria-expanded','false')}
function updateWorldClock(){
 const w=selectedDemoWorld();const isRealTime=Boolean(w&&(w.realTime===true||w.progression==='persistent'||w.clockMode==='real_time'));
 const raw=isRealTime?w?.serverTime:(w?.started===true?w?.worldTime:null);
 const display=typeof raw==='string'&&/^\d{1,2}:\d{2}$/.test(raw)?raw:'--:--';
 const elClock=el('worldClock');if(elClock){elClock.textContent=`${isRealTime?'SERVER':'WORLD'} ${display}`;elClock.title=isRealTime?'Server-provided real-time World clock; no server clock available in the preview':'World simulation time; not started or unavailable';}
}
function updateClock(){try{const time='LOCAL '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});if(el('clock'))el('clock').textContent=time;if(el('launcherClock'))el('launcherClock').textContent=time;updateWorldClock();}catch{}}updateClock();setInterval(updateClock,30000);render();
</script>
