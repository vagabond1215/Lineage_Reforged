/* Review refinement: compact left rail, actual visible resource bars and marginal taxonomy. */
.railnav{margin:0 0 14px}
.railhr{margin:11px 0 13px}
.who{margin:0 0 13px}
.resources{display:grid;grid-template-columns:1fr;gap:9px;margin:0 0 16px}
.resbar{min-width:0}
.resbar-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;color:#c8c4b8;font-size:10px;font-weight:700;letter-spacing:.11em}
.resbar-head strong{color:#e9ddc7;font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
.resbar-track{height:7px;border:1px solid #485158;background:#0d141a;border-radius:999px;overflow:hidden}
.resbar-fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9f534d,#d57d6f)}
.resbar.mp .resbar-fill{background:linear-gradient(90deg,#476c94,#80acda)}
.resbar.stamina .resbar-fill{background:linear-gradient(90deg,#7c8860,#aebe88)}
.statgroups{display:grid;gap:0}
.statgroup{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:stretch;border-top:1px solid #424746;padding:9px 0 10px;min-height:75px}
.statgroup:last-child{border-bottom:1px solid #424746}
.grouplabel{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.16em;font-size:10px;color:#c4aa80;text-transform:uppercase;font-weight:750;border:0;margin:0;padding:1px 0}
.groupvalues{border-left:1px solid #394247;padding-left:12px;display:grid;align-content:center;gap:2px}
.statline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:1px 3px;margin:0;color:#c4c7c6}
.statline span{font-weight:600;color:#a9b4b9;font-size:11px}
.statline strong{font-size:13px;font-variant-numeric:tabular-nums;color:#eee1ca}
/* Identity's selected rail step already identifies the active view. */
.content.identity-stage{padding-top:22px}
.content.identity-stage>.heading,.content.identity-stage>.hline{display:none}
.portraitfoot h3{margin-bottom:10px}
.portraitfoot .outlinebtn{margin-top:8px}
@media(max-width:550px){
  .railstat{display:block}
  .railnav{margin:9px 0 11px}
  .statgroup{grid-template-columns:40px minmax(0,1fr)}
  .resources{gap:8px}
}

/* Keep all nine sidebar attributes visible on a typical laptop height. */
@media (min-width:551px){
 .railinner{padding-top:14px;padding-bottom:12px}
 .navbtn{min-height:36px}
 .railnav{gap:4px;margin-bottom:11px}
 .railhr{margin:9px 0 11px}
 .who{font-size:23px;margin-bottom:9px}
 .resources{gap:7px;margin-bottom:12px}
 .resbar-head{margin-bottom:3px}
 .statgroup{min-height:67px;padding:7px 0}
}

/* Restore the two-tier AppShell chrome: brand corner, top controls, separate contextual sub-bar. */
:root{--creator-rail-width:266px}
.chrome{display:grid;grid-template-columns:var(--creator-rail-width) minmax(0,1fr);grid-template-rows:auto auto;position:sticky;top:0;z-index:30;box-shadow:0 5px 16px #090d1233}
.brandwell{grid-column:1;grid-row:1/3;min-width:0;background:#141b20;border-right:1px solid #3e4446;border-bottom:1px solid #475052}
.brandwell .brand{min-height:100%;padding:18px;display:flex;align-items:center}
.chrome .top{grid-column:2;grid-row:1;min-height:72px;justify-content:flex-end;position:relative;top:auto;z-index:auto;border-bottom:1px solid #363f42}
.chrome .mobilebrand{display:none}
.chrome .subbar{grid-column:2;grid-row:2;display:flex;align-items:center;gap:18px;min-height:44px;padding:8px 26px;background:#1b252a;border-bottom:1px solid #475052;min-width:0}
.chrome .crumbs{margin:0;display:flex;flex:1;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:auto;scrollbar-width:none;letter-spacing:.035em}
.chrome .crumbs::-webkit-scrollbar{display:none}
.chrome .crumbs strong{color:#f1dfc3;font-weight:650}
.chrome .substatus{flex-shrink:0;margin-left:auto;color:#aeb8b7;font-size:10px;letter-spacing:.02em}
.body{grid-template-columns:var(--creator-rail-width) minmax(0,1fr);min-height:0}
.railinner{top:116px;max-height:calc(100vh - 116px)}
@media (max-width:1090px){:root{--creator-rail-width:232px}.chrome .subbar{padding-left:22px;padding-right:22px}}
@media (max-width:900px){

const sumValues=obj=>Object.values(obj).reduce((a,b)=>a+b,0);
const emptyPoints=()=>Object.fromEntries(ATTRIBUTE_KEYS.map(k=>[k,0]));
function weightedAllocate(amount,weights){
 const out=emptyPoints();if(!amount)return out;
 const all=Object.entries(weights),total=all.reduce((s,[,w])=>s+w,0);
 const entries=all.map(([key,weight],order)=>({key,order,raw:amount*weight/total}));
 for(const entry of entries)out[entry.key]=Math.floor(entry.raw);
 let rest=amount-entries.reduce((s,e)=>s+out[e.key],0);
 for(const entry of [...entries].sort((a,b)=>(b.raw%1)-(a.raw%1)||a.order-b.order)){if(rest<=0)break;out[entry.key]++;rest--}
 return out;
}
function getGeneratedProfile(build,aptitude){
 const physical=aptitude.physical,mindCount=aptitude.mind;
 const powerCount=Math.round(physical*build.power),prowessCount=physical-powerCount;
 const power=weightedAllocate(powerCount,build.wPower),prowess=weightedAllocate(prowessCount,build.wProwess);
 const mind=weightedAllocate(mindCount,aptitude.mindWeights);
 const physicalBonus=emptyPoints(),bonus=emptyPoints();
 for(const k of ATTRIBUTE_KEYS){physicalBonus[k]=power[k]+prowess[k];bonus[k]=physicalBonus[k]+mind[k];}
 return {power,prowess,mind,physicalBonus,bonus,physical,mindCount,powerCount,prowessCount};
}

 // Current repository zero-sum sex, age and height biases. Future lineage-specific sex policies held.
 if(state.sex==='female')shift('AGI','STR');
 if(state.age==='young_adult')shift('AGI','WIS');
 if(state.age==='prime')shift('STR','AGI');
 if(state.age==='mature')shift('WIS','STR');
 if(state.age==='senior')shift('WIS','VIT');
 if(state.height==='short')shift('AGI','STR');
 if(state.height==='tall')shift('STR','AGI');
 const b=builds.find(x=>x.id===state.build)||builds[4];
 const a=aptitudes.find(x=>x.id===state.aptitude)||aptitudes[3];
 const generated=getGeneratedProfile(b,a),attrs=emptyPoints();
 for(const k of ATTRIBUTE_KEYS){attrs[k]=baseline[k]+direct[k]+generated.bonus[k]}
 const [hpLine,mpLine,stLine]=RESOURCE_LINEAGE[state.lineage]||[0,0,0];
 const resources={hp:120+hpLine+4*(attrs.CON-10+attrs.VIT-10),mp:60+mpLine+4*(attrs.INT-10+attrs.SPT-10),stamina:100+stLine+3*(attrs.AGI-10+attrs.CON-10+attrs.VIT-10)};

 `<div class="opening-receipt" role="status"><strong>First decision recorded in this preview</strong><span>${esc(label)}</span></div><p>This first action is the proposed character-creation completion and World Entry circumstance selection in one transaction. In this offline review, it is recorded only in memory. No character, campaign, inventory or Save has been published.</p><p>The next story scene requires an accepted World site and authored action owner. The preview does not invent that continuation.</p><button type="button" class="outlinebtn" id="resetEntryChoice">Revisit the first decision (preview)</button>`:
 `<h3>Your first decision</h3><p>The choice you make here is also the intended <strong>Finalize / Submit</strong> action for your character. In the live game, it must validate and commit this exact opening, its circumstance, and the character together, once. This preview records your choice only locally.</p><div class="opening-choices" role="group" aria-label="First World Entry decision"><button type="button" class="opening-choice" data-entry-choice="a"><span class="choice-name">${esc(s.a)}</span><span class="choice-meta">A · Choose opening &amp; submit (preview)</span></button><button type="button" class="opening-choice" data-entry-choice="b"><span class="choice-name">${esc(s.b)}</span><span class="choice-meta">B · Choose opening &amp; submit (preview)</span></button></div><p class="opening-caveat">Gameplay submission is held: the required World, scene, item and Save owners are not connected in this standalone preview.</p>`;
 return `<section class="opening-sheet" aria-labelledby="openingSceneTitle"><div class="opening-kicker">The beginning · ${esc(s.name)}</div><h2 id="openingSceneTitle">${esc(s.name)}</h2><p class="opening-place">${esc(getName())} · ${esc(state.settlement)} · Ordinary Core · Editorial narrative</p><div class="opening-prose"><p>${esc(s.intro)}</p></div><div class="opening-decision" aria-live="polite">${decision}</div></section><div class="opening-actions"><button type="button" class="outlinebtn" id="backSummary">← Back to Summary</button><span class="hint">Design preview only · No Save written</span></div>`;
}
function footer(center){
 const label=state.stage===5?'Continue to Summary':state.stage===6?'Continue to Opening':'Next';
 return `<div class="foot">${center?`<button type="button" class="outlinebtn randomcenter" id="identityDice">⚄ ${center}</button>`:''}<button type="button" class="primary" id="next">${label} →</button></div>`;
}
function next(){
 if(!stageValid(state.stage)){state.validation=true;render();if(state.stage===1)el('firstName')?.focus();return}
 if(state.stage<7)nav(state.stage+1);
}
function selectGeo(which,value){if(which==='continent'){state.continent=value;state.region=(geo.find(x=>x[0]===value)?.[2]||[])[0]||'';state.settlement=(geoKnown[state.region]||[])[0]||'';}else if(which==='region'){state.region=value;state.settlement=(geoKnown[value]||[])[0]||'';}else state.settlement=value;state.scenario=null;state.pool='ordinary';invalidateOpening();render()}
function selectLineage(value){state.lineage=value;state.skin=3;state.hair=4;state.eyes=9;state.scenario=null;invalidateOpening();render()}
function randomIdentity(){const pick=a=>a[Math.floor(Math.random()*a.length)];for(const key of Object.keys(identityChoices)){state[key]=pick(identityChoices[key])[0]}state.build=pick(builds).id;state.aptitude=pick(aptitudes).id;state.disposition=pick(dispositions)[0];state.skin=Math.floor(Math.random()*swatches.skin.length);state.hair=Math.floor(Math.random()*swatches.hair.length);state.eyes=Math.floor(Math.random()*swatches.eyes.length);state.validation=false;invalidateOpening();render()}
function randomName(){const firsts=['Aerin','Liora','Kael','Seren','Mara','Torren','Sable','Nerin','Tavia','Bren'],lasts=['Vale','Morrow','Reed','Ashfall','Hearth','Stone','Thorne','Mere','Dawn','Rowan'];state.firstName=firsts[Math.floor(Math.random()*firsts.length)];state.lastName=lasts[Math.floor(Math.random()*lasts.length)];syncName();state.validation=false;invalidateOpening();render()}
function openDialog(title,body,actions,eyebrow='Editorial preview'){el('dialogEyebrow').textContent=eyebrow;el('dialogTitle').textContent=title;el('dialogBody').innerHTML=body;el('dialogActions').innerHTML=actions;el('dialogbg').classList.add('open');}
function story(sid){
 const s=findScenario(sid);if(!s)return;
 if(s.pool==='wilderness')return openDialog(s.name,`<p>${esc(s.intro)}</p><p class="hint">Hardcore wilderness remains editorial, with no verified playable scene or Save submission.</p>`,`<button id="closeContinuation">Return to World Entry</button>`);
 state.pool='ordinary';state.scenario=sid;invalidateOpening();render();
}
function chooseOpening(choice){
 if(state.stage!==7||!['a','b'].includes(choice)||!canVisit(7))return;
 const s=findScenario(state.scenario);if(!s||s.pool!=='ordinary')return;
 state.entryChoice={scenario:s.id,choice};
 render();
}

function portraitPrompt(){const l=lineages.find(x=>x[0]===state.lineage)?.[1]||'fantasy lineage';const disposition=state.disposition==='none'?'neutral':state.disposition;const b=builds.find(x=>x.id===state.build)?.label||'proportioned';const prompt=`masterpiece, high-resolution, full color, expert shading, photorealistic, single adult ${l.toLowerCase()} ${state.sex}, ${state.age} age, ${state.height} height, ${b.toLowerCase()} body shape, ${disposition} facial expression, modest medieval fantasy attire, head-and-shoulders framing, no hands in frame`;openDialog('Portrait prompt',`<div class="codeprompt" id="promptText">${esc(prompt)}</div><p>Copy this prompt into an external generator. This preview does not call an image model.</p>`,`<button id="copyPrompt">Copy prompt</button>`,'Identity portrait handoff')}
function render(){renderRail();el('stage').innerHTML=renderStage();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav!==undefined)return nav(Number(b.dataset.nav));if(b.dataset.pick){const k=b.dataset.pick,v=b.dataset.value;if(k==='lineage')selectLineage(v);else selectGeo(k,v);return}if(b.dataset.color){state[b.dataset.color]=Number(b.dataset.index);invalidateOpening();return render()}if(b.dataset.inspectCondition){const key=b.dataset.group==='negative'?'inspectedNegative':'inspectedPositive';state[key]=b.dataset.inspectCondition;render();return}if(b.dataset.profile){state[b.dataset.profile]=b.dataset.choiceValue;state.validation=false;invalidateOpening();return render()}if(b.dataset.sex){state.sex=b.dataset.sex;invalidateOpening();return render()}if(b.dataset.pool){state.pool=b.dataset.pool;state.scenario=null;invalidateOpening();return render()}if(b.dataset.story){return story(b.dataset.story)}if(b.dataset.entryChoice){return chooseOpening(b.dataset.entryChoice)}if(b.id==='resetEntryChoice'){state.entryChoice=null;return render()}if(b.id==='backSummary')return nav(6);if(b.id==='next')return next();if(b.id==='nameDice')return randomName();if(b.id==='identityDice')return randomIdentity();if(b.id==='generate')return portraitPrompt();if(b.id==='dialogClose'||b.id==='closeContinuation')return el('dialogbg').classList.remove('open');if(b.id==='copyPrompt'){const text=el('promptText')?.textContent||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>{b.textContent='Copied'}).catch(()=>{b.textContent='Select text to copy'});return}if(b.id==='accountBtn')return el('account').classList.toggle('open');if(b.id==='mobileToggle'){const open=el('railCollapse').classList.toggle('open');b.setAttribute('aria-expanded',String(open));return}if(b.id==='themeBtn'){document.documentElement.style.filter=document.documentElement.style.filter?'':'brightness(1.17)';el('account').classList.remove('open');}});
document.addEventListener('change',e=>{const fld=e.target.dataset.field;if(fld){state[fld]=e.target.value;invalidateOpening();render()}});
document.addEventListener('input',e=>{
 if(e.target.id==='firstName'||e.target.id==='lastName'){
  state[e.target.id]=e.target.value;syncName();invalidateOpening();state.validation=false;
  renderRail();
  document.querySelectorAll('[data-narrative]').forEach(node=>{node.textContent=narrativeFor(node.dataset.narrative)});
  const caption=el('portraitCaption');if(caption)caption.textContent=summarySentence();
  const heading=document.querySelector('.portraitfoot h3');if(heading)heading.textContent=fullName()||'Unnamed Wanderer';
  const notice=document.querySelector('.validation');if(notice)notice.classList.remove('show');
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')el('dialogbg').classList.remove('open')});
el('dialogbg').addEventListener('click',e=>{if(e.target===el('dialogbg'))el('dialogbg').classList.remove('open')});
if(window.matchMedia('(max-width:550px)').matches){el('railCollapse').classList.remove('open');el('mobileToggle').setAttribute('aria-expanded','false')}
function updateClock(){try{el('clock').textContent='LOCAL '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}catch{}}updateClock();setInterval(updateClock,30000);render();
</script>
</body></html>
