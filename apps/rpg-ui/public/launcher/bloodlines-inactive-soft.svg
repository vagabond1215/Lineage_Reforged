<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-label="Bloodlines inactive sidebar art">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2926" stop-opacity="0.82" />
      <stop offset="0.52" stop-color="#181715" stop-opacity="0.9" />
      <stop offset="1" stop-color="#0d0d0c" stop-opacity="0.92" />
    </linearGradient>
    <radialGradient id="leftAtmosphere" cx="28%" cy="48%" r="62%">
      <stop offset="0" stop-color="#5a1715" stop-opacity="0.2" />
      <stop offset="0.46" stop-color="#4c3323" stop-opacity="0.12" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldBruise" cx="42%" cy="18%" r="58%">
      <stop offset="0" stop-color="#bda66f" stop-opacity="0.13" />
      <stop offset="0.5" stop-color="#776b5a" stop-opacity="0.05" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="paint" x="-8%" y="-18%" width="116%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.075" numOctaves="4" seed="19" result="grain" />
      <feColorMatrix in="grain" type="matrix" values="0.16 0 0 0 0.09 0 0.13 0 0 0.08 0 0 0.1 0 0.06 0 0 0 0.22 0" result="grainColor" />
      <feBlend in="SourceGraphic" in2="grainColor" mode="screen" />
    </filter>
    <filter id="soften" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="1.15" />
    </filter>
    <filter id="shadow" x="-8%" y="-18%" width="116%" height="136%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.42" />
    </filter>
    <clipPath id="plateClip">
      <rect x="4" y="5" width="692" height="190" rx="10" />
    </clipPath>
  </defs>

