      <path d="M210 126 C265 158 330 166 405 148" stroke="#7d2521" stroke-opacity="0.44" stroke-width="3" />
      <path d="M210 78 C170 54 135 52 98 72" stroke="#7d2521" stroke-opacity="0.4" stroke-width="3" />
