      <stop offset="0" stop-color="#2b2118" stop-opacity="0.98" />
      <stop offset="0.54" stop-color="#17120e" stop-opacity="0.98" />
      <stop offset="1" stop-color="#0c0b09" stop-opacity="0.98" />
