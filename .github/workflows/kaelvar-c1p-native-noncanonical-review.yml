          node --check scripts/kaelvar-c1ab-shared-seam-junctions.mjs
          node --check tests/unit/kaelvar-c1ab-shared-seam-junction-audit.test.mjs
          node --test tests/unit/kaelvar-c1ab-shared-seam-junction-audit.test.mjs
          node scripts/kaelvar-c1ab-shared-seam-junctions.mjs --check > "$RUNNER_TEMP/c1ab-shared-seam-junction-audit.json"
