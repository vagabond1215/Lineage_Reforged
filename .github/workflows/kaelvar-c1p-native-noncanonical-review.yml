          node scripts/kaelvar-c1p-regional-seams.mjs --seam-trials-check > "$RUNNER_TEMP/c1z-reversible-waypoint-trials.json"
          node - "$RUNNER_TEMP/c1z-reversible-waypoint-trials.json" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(r.status,'C1Z_FOUR_SOURCE_INDEXED_REVERSIBLE_WAYPOINT_TRIALS_CANONICAL_HELD');
          assert.equal(r.sourceWitness.sourceCoastlineEdges,599);
          assert.equal(r.sourceWitness.originalMainlandPhysicalComponent,30);
          assert.equal(r.baseline.politicallyAssigned,52449);
          assert.equal(r.baseline.unassigned,26970);
          assert.equal(r.baseline.totalMainland,79419);
          assert.deepEqual(r.baseline.perRegion,[5632,18624,19182,9011]);
          assert.deepEqual(r.alternatives.map(x=>x.id),[
            'NORTH_VEYRHOLM_SOUTH_TWO',
            'NORTH_KHARUUN_NORTH_TWO',
            'SOUTH_KHARUUN_SOUTH_THREE',
            'SOUTH_VERDANT_NORTH_THREE']);
          assert.equal(r.alternatives.length,4);
          assert.deepEqual(r.alternatives.map(x=>x.status),[
            'VALID_REVERSIBLE_REDUCED_GAP_REVIEW_ONLY',
            'VALID_REVERSIBLE_REDUCED_GAP_REVIEW_ONLY',
            'VALID_REVERSIBLE_REDUCED_GAP_REVIEW_ONLY',
            'VALID_REVERSIBLE_REDUCED_GAP_REVIEW_ONLY'
          ]);
          assert.deepEqual(r.alternatives.map(x=>x.baselineUnassignedGapSamples),
            [10,10,15,15]);
          assert.deepEqual(r.alternatives.map(x=>x.trialUnassignedGapSamples),
            [8,9,13,12]);
          assert.deepEqual(r.alternatives.map(x=>x.changedOriginalMainlandSamples),
            [30,29,53,54]);
          assert.deepEqual(r.alternatives.map(x=>x.delta),[
            {gained:30,released:0},{gained:29,released:0},
            {gained:53,released:0},{gained:54,released:0}
          ]);
          assert.deepEqual(r.alternatives.map(x=>x.trialMidGapReviewPoint),[
            {x:285,y:194},{x:292,y:190},
            {x:319,y:327},{x:319,y:324}
          ]);
          assert.deepEqual(r.alternatives.map(x=>x.trialPathSha256),[
            'adc58f2f45e47ab88bb77ef45fdafc36e2b2008eb3ffd69db30cb928e3286c7a',
            '120351dc83719c6c46119daff1cb18f5aec75180ca57ce87b8b5874b0976f555',
            'c6d37bafd51f8f5c5dfc85d09398c78271fa2d1a808ca02b97e15d8a75744dc4',
            'e55089e55354ca6901b57975621dfedf804d818946e4a1d43c53b0fef33795c0'
          ]);
          assert.deepEqual(r.alternatives.map(x=>x.trialSourceTerrainCandidatesByRegion),[
            [5632,18624,19182,9041],
            [5632,18653,19182,9011],
            [5632,18677,19182,9011],
            [5632,18624,19236,9011]
          ]);
          assert.deepEqual(r.interfaceReadiness.map(x=>x.hasReducedGapOption),
            [true,true]);
          assert.equal(r.sourceGeometricValidReviewOptions.length,4);
          for(const row of r.alternatives){
            assert.equal(row.proposedPermanentSourceOrRegionEdit,false);
            assert.equal(row.ownerApproval,false);
            assert.equal(row.sourceArcChanged,false);
            assert.equal(row.acceptedAsC1PRegion,false);
            assert.equal(row.canonicalWritable,false);
            assert.ok(row.status.startsWith('VALID_')||
              row.status==='REJECTED_NO_SOURCE_OR_POLITICAL_CHANGE');
            assert.equal(row.originalLocalReturn.length,3);
            assert.equal(row.proposedLocalReturn.length,3);
            if(row.status.startsWith('VALID_')){
              assert.equal(row.regionSourceCoastEdgesUnchanged,true);
              assert.equal(row.originalProtectedAnchorsPreserved,true);
              assert.equal(row.regionalCollisions,0);
              assert.equal(row.originalCoastCrossings,0);
              assert.equal(row.protectedOffshoreContourCrossings,0);
              assert.equal(row.originalComponent30Only,true);
              assert.ok(row.changedOriginalMainlandSamples>0);
              assert.ok(row.changedOriginalMainlandSamples<=250);
              assert.equal(row.changedOriginalMainlandSamples,row.changeCells.length);
              assert.ok(row.trialUnassignedGapSamples>=4);
              assert.ok(row.trialUnassignedGapSamples<=row.baselineUnassignedGapSamples);
              assert.equal(row.trialAssignedCandidateCells+
                row.trialUnassignedCandidateCells,79419);
              assert.match(row.trialPathSha256,/^[0-9a-f]{64}$/);
              assert.ok(row.changeCells.every(x=>
                x.from===0||x.to===0));
            }else{
              assert.ok(row.reason?.length>0);
            }
          }
          assert.equal(r.interpretation.trialPolygonsAreNotAcceptedWorldContent,true);
          assert.equal(r.interpretation.noTrialAutomaticallySelected,true);
          assert.equal(r.unchanged.acceptedC1PRegionRingChanges,0);
          assert.equal(r.unchanged.acceptedC1POwnerChanges,0);
          assert.equal(r.unchanged.originalSourceRasterChanges,0);
          assert.equal(r.unchanged.originalComponentLabelChanges,0);
          assert.equal(r.unchanged.newTerritorialClaims,0);
          assert.equal(r.unchanged.originalDetachedPhysicalComponentClaims,0);
          assert.equal(r.unchanged.canonicalWritable,false);
          assert.deepEqual(r.unchanged.originalKharuunOptionBSourceEdges,[35,58]);
          assert.deepEqual(r.unchanged.northeasternHeadlandOriginalEdges,[75,115]);
          assert.equal(r.unchanged.northeasternHeadlandOwner,null);
          assert.equal(r.unchanged.component51Owner,null);
          assert.equal(r.unchanged.shattercapUnassigned,true);
          assert.equal(r.unchanged.largeNEIslandUnassigned,true);
          console.log('C1-Z waypoint trial results: '+r.alternatives.map(x=>
            x.id+': '+x.status+
            (x.trialUnassignedGapSamples===undefined?'':', gap '+x.baselineUnassignedGapSamples+
              ' -> '+x.trialUnassignedGapSamples)+
            (x.changedOriginalMainlandSamples===undefined?'':', delta '+x.changedOriginalMainlandSamples)
          ).join('; '));
          NODE
          node scripts/kaelvar-c1p-regional-seams.mjs --seam-trials-svg > "$RUNNER_TEMP/c1z-reversible-mainland-seam-options.svg"
          test -s "$RUNNER_TEMP/c1z-reversible-mainland-seam-options.svg"
      - name: C1-AA paired original elevation-first vs biome-secondary region seams
        run: |
          node scripts/kaelvar-c1p-regional-seams.mjs --relief-prework-check > "$RUNNER_TEMP/c1aa-relief-first-source-report.json"
          node - "$RUNNER_TEMP/c1aa-relief-first-source-report.json" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(r.status,'C1AA_PAIRED_ORIGINAL_RELIEF_PREWORK_SOURCE_VERIFIED_SELECTION_HELD');
          assert.equal(r.source.originalCoastlineEdges,599);
          assert.equal(r.source.originalBiomeSha256,
            '9828eb8970dc0aa7ec1f046f51ee0542ab11c2fe7776eeaa52605d42f00cff12');
          assert.equal(r.source.originalElevationSha256,
            '02c3b133f2b3f08aed56f98bde4c846d6e3316c71de171837cb61a02785ec56d');
          assert.deepEqual(r.source.imageFormats,{
            biome:{bitDepth:8,colorType:6},
            elevation:{bitDepth:8,colorType:6}
          });
          assert.equal(r.elevationInterpretation.rampCalibration,'UNVERIFIED_COLOR_RAMP');
          assert.equal(r.elevationInterpretation.sourceRGBMeansMeters,false);
          assert.equal(r.elevationInterpretation.automaticRidgeOrWatershedProven,false);
          assert.equal(r.primaryRegionAndTransitionDesign.futureFinalizedLandPrimaryRegion,'EXACTLY_ONE');
          assert.equal(r.primaryRegionAndTransitionDesign.regionIsPoliticalTerritory,false);
          assert.equal(r.comparedInterfaces.length,2);
          assert.deepEqual(r.comparedInterfaces.map(x=>x.options.length),[3,3]);
          assert.deepEqual(r.comparedInterfaces.map(x=>x.options.map(o=>o.id)),[
            ['KEEP_C1P_UNCHANGED','NORTH_VEYRHOLM_SOUTH_TWO','NORTH_KHARUUN_NORTH_TWO'],
            ['KEEP_C1P_UNCHANGED','SOUTH_KHARUUN_SOUTH_THREE','SOUTH_VERDANT_NORTH_THREE']
          ]);
          assert.deepEqual(r.comparedInterfaces.map(x=>
            x.options.map(o=>o.residualUnassignedGapSamples)),[[10,8,9],[15,13,12]]);
          for(const region of r.comparedInterfaces){
            assert.equal(region.reliefJudgment,'HOLD_UNCALIBRATED_ELEVATION_RAMP');
            assert.equal(region.recommendedCanonicalChange,null);
            assert.equal(region.acceptedC1PKept,true);
            for(const opt of region.options){
              assert.equal(opt.independentOwnerSelection,false);
              assert.equal(opt.topographicRanking,'INSUFFICIENT_CALIBRATED_RELIEF');
              assert.equal(opt.transitoryWidthClaim,null);
              assert.equal(opt.sourceVerifiedGeographicFeature,null);
            }
          }
          assert.equal(r.conclusions.ownerTopographicDecision,null);
          assert.equal(r.conclusions.noMeasuredElevationOrWatershedClaim,true);
          assert.equal(r.conclusions.noBiomeColorOnlyWinner,true);
          assert.equal(r.conclusions.noAutomaticGapClosing,true);
          assert.equal(r.conclusions.noApprovedRegionalRegionGeometryChanges,true);
          assert.equal(r.baseline.originalMainlandCandidates,79419);
          assert.equal(r.baseline.provisionalAssigned,52449);
          assert.equal(r.baseline.unassigned,26970);
          assert.deepEqual(r.baseline.perRegion,[5632,18624,19182,9011]);
          assert.equal(r.baseline.originalSourcePixelEdits,0);
          assert.equal(r.baseline.sourceVectorEdits,0);
          assert.equal(r.baseline.originalTerrainLabelsChanged,0);
          assert.equal(r.baseline.acceptedRegionRingsChanged,0);
          assert.equal(r.baseline.detachedComponentClaims,0);
          assert.equal(r.baseline.canonicalWritable,false);
          console.log('C1-AA original elevation/biome pair verified; all six options held pending landform interpretation');
          console.log('C1-AA PNG formats '+JSON.stringify(r.source.imageFormats));
          console.log('C1-AA paired original RGB witnesses: '+JSON.stringify(
            r.comparedInterfaces.map(g=>({
              interface:g.id,
              centerOriginalRGB:g.options[0].originalSourceSample,
              trialPointOriginalRGB:g.options.slice(1).map(t=>({
                id:t.id,
                before:t.originalOriginalPairSample,
                after:t.trialOriginalPairSample
              }))
            }))
          ));
          NODE
          node scripts/kaelvar-c1p-regional-seams.mjs --relief-prework-elevation-svg > "$RUNNER_TEMP/c1aa-original-elevation-seam-comparison.svg"
          node scripts/kaelvar-c1p-regional-seams.mjs --relief-prework-biome-svg > "$RUNNER_TEMP/c1aa-original-biome-seam-comparison.svg"
          test -s "$RUNNER_TEMP/c1aa-original-elevation-seam-comparison.svg"
          test -s "$RUNNER_TEMP/c1aa-original-biome-seam-comparison.svg"
          grep -q 'ORIGINAL ELEVATION COLOR RAMP' "$RUNNER_TEMP/c1aa-original-elevation-seam-comparison.svg"
          grep -q 'ORIGINAL BIOME ART' "$RUNNER_TEMP/c1aa-original-biome-seam-comparison.svg"
          grep -q 'KEEP C1P UNCHANGED' "$RUNNER_TEMP/c1aa-original-elevation-seam-comparison.svg"
          sha256sum "$RUNNER_TEMP/c1aa-relief-first-source-report.json" "$RUNNER_TEMP/c1aa-original-elevation-seam-comparison.svg" "$RUNNER_TEMP/c1aa-original-biome-seam-comparison.svg"
