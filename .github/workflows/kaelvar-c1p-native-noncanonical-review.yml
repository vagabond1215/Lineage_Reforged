name: C1-P native mainland seam review (noncanonical)

on:
  push:
    branches:
      - connector/c1o-kaelvar-regional-boundary-candidates-2026-11-14
    paths:
      - 'scripts/kaelvar-c1p-regional-seams.mjs'
      - 'scripts/lib/kaelvar-c1p-regional-seam-review.mjs'
      - 'tests/unit/kaelvar-c1p-regional-seam-review.test.mjs'
      - 'scripts/lib/kaelvar-c1q-headland-continuity.mjs'
      - 'tests/unit/kaelvar-c1q-headland-continuity.test.mjs'
      - 'scripts/lib/kaelvar-c1r-headland-source-diagnostics.mjs'
      - 'tests/unit/kaelvar-c1r-headland-source-diagnostics.test.mjs'
      - 'scripts/lib/kaelvar-c1s-headland-ink-sensitivity.mjs'
      - 'tests/unit/kaelvar-c1s-headland-ink-sensitivity.test.mjs'
      - 'scripts/lib/kaelvar-c1t-source-pinch-and-island-contact.mjs'
      - 'tests/unit/kaelvar-c1t-source-pinch-and-island-contact.test.mjs'
      - 'docs/design/kaelvar-c1t-teal-pinch-and-detached-component-contact-review-2026-11-14.json'
      - 'docs/design/kaelvar-c1s-headland-shared-ink-sensitivity-2026-11-14.json'
      - 'docs/design/kaelvar-c1r-headland-source-bottleneck-probe-2026-11-14.json'
      - 'docs/design/kaelvar-c1q-northeast-headland-options-2026-11-14.json'
      - 'docs/design/kaelvar-c1p-refined-mainland-seam-candidates-2026-11-14.json'
      - '.github/workflows/kaelvar-c1p-native-noncanonical-review.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-source-raster-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source and frozen legacy baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check native code syntax
        run: |
          node --check scripts/lib/kaelvar-c1p-regional-seam-review.mjs
          node --check scripts/lib/kaelvar-c1q-headland-continuity.mjs
          node --check scripts/lib/kaelvar-c1r-headland-source-diagnostics.mjs
          node --check scripts/lib/kaelvar-c1s-headland-ink-sensitivity.mjs
          node --check scripts/lib/kaelvar-c1t-source-pinch-and-island-contact.mjs
          node --check scripts/kaelvar-c1p-regional-seams.mjs
          node --check tests/unit/kaelvar-c1p-regional-seam-review.test.mjs
          node --check tests/unit/kaelvar-c1q-headland-continuity.test.mjs
          node --check tests/unit/kaelvar-c1r-headland-source-diagnostics.test.mjs
          node --check tests/unit/kaelvar-c1s-headland-ink-sensitivity.test.mjs
          node --check tests/unit/kaelvar-c1t-source-pinch-and-island-contact.test.mjs
      - name: C1-O baseline and C1-P rejection tests
        run: |
          node --test tests/unit/kaelvar-c1o-regional-boundaries.test.mjs tests/unit/kaelvar-c1p-regional-seam-review.test.mjs tests/unit/kaelvar-c1q-headland-continuity.test.mjs tests/unit/kaelvar-c1r-headland-source-diagnostics.test.mjs tests/unit/kaelvar-c1s-headland-ink-sensitivity.test.mjs tests/unit/kaelvar-c1t-source-pinch-and-island-contact.test.mjs
          node scripts/check-no-new-hex-dependencies.mjs --check
      - name: Source PNG and vector verified candidate raster measurements
        run: |
          node scripts/kaelvar-c1p-regional-seams.mjs --check > "$RUNNER_TEMP/c1p-native-review.json"
          node - "$RUNNER_TEMP/c1p-native-review.json" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(r.status,'C1P_REFINED_FOUR_MAINLAND_RINGS_CANONICAL_HELD');
          assert.equal(r.sourcePngFingerprintsVerified,true);
          assert.equal(r.sourceOriginalContourUnmodified,true);
          assert.equal(r.originalSourceEdgesConserved,599);
          assert.equal(r.diagnostic.polygonOwnershipCollisions,0);
          assert.equal(r.diagnostic.sourceContourCrossings,0);
          assert.equal(r.diagnostic.protectedOffshoreSourceClaims,0);
          assert.equal(r.measurements.candidateMainlandTerrainCells,79419);
          assert.equal(r.measurements.baselineAssignedMainlandTerrainCells,53158);
          assert.equal(r.measurements.baselineUnassignedMainlandTerrainCells,26261);
          assert.ok(r.measurements.remainingUnassignedMainlandTerrainCells>0);
          assert.equal(r.measurements.detachedPhysicalComponentsClaimed,0);
          assert.equal(r.measurements.perRegion.length,4);
          assert.equal(r.holds.canonicalWritable,false);
          assert.equal(r.measurements.perRegion.reduce((n,x)=>n+x.terrainCandidateCells,0)
            +r.measurements.remainingUnassignedMainlandTerrainCells,79419);
          const k=r.regionCandidates.find(x=>x.regionId==='region.kharuun_drylands');
          assert.equal(k.sourceEdgeIndices.length,24);
          assert.equal(k.sourceEdgeIndices[0],35);
          assert.equal(k.sourceEdgeIndices.at(-1),58);
          console.log('C1-P native component-30 terrain allocation CONSERVED; publication HELD');
          NODE
      - name: Produce source-backed before-after and northern preview
        run: |
          node scripts/kaelvar-c1p-regional-seams.mjs --svg > "$RUNNER_TEMP/c1p-original-versus-refined.svg"
          node scripts/kaelvar-c1p-regional-seams.mjs --north-svg > "$RUNNER_TEMP/c1p-refined-north-coast.svg"
          test -s "$RUNNER_TEMP/c1p-original-versus-refined.svg"
          test -s "$RUNNER_TEMP/c1p-refined-north-coast.svg"
      - name: C1-Q source-indexed NE headland continuity and no-allocation options
        run: |
          node scripts/kaelvar-c1p-regional-seams.mjs --headland-check > "$RUNNER_TEMP/c1q-headland-review.json"
          node - "$RUNNER_TEMP/c1q-headland-review.json" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(r.status,'C1Q_NORTHEAST_HEADLAND_OPTIONS_REVIEW_ONLY_NO_POLITICAL_ALLOCATION');
          assert.deepEqual([r.headland.originalSourceEdgeIndices[0],
            r.headland.originalSourceEdgeIndices.at(-1)],[75,115]);
          assert.equal(r.headland.originalSourceEdgeIndices.length,41);
          assert.equal(r.headland.politicalOwner,null);
          assert.deepEqual(r.options.map(x=>x.id),
            ['HOLD_UNASSIGNED','VERDANT_CORRIDOR_EVIDENCE_ONLY']);
          assert.equal(r.c1pTerrainConservation.mainlandCandidateCells,79419);
          assert.equal(r.c1pTerrainConservation.assigned,52449);
          assert.equal(r.c1pTerrainConservation.unassigned,26970);
          assert.equal(r.c1pTerrainConservation.additionalTerritorialCellsAssigned,0);
          assert.equal(r.c1pTerrainConservation.detachedComponentsClaimed,0);
          assert.equal(r.limits.noNewPolygonOrCanonicalPublication,true);
          assert.equal(r.candidateCorridors.length,3);
          assert.deepEqual(r.candidateCorridors.map(x=>x.clearancePx),[0,1,2]);
          assert.deepEqual(r.candidateCorridors.map(x=>x.found),[true,false,false]);
          assert.deepEqual(r.candidateCorridors.map(x=>x.startIsPermitted),[true,true,true]);
          assert.deepEqual(r.candidateCorridors.map(x=>x.targetIsPermitted),[true,true,true]);
          assert.equal(r.candidateCorridors[0].pixelSteps,223);
          assert.equal(r.candidateCorridors[0].pathSha256,
            '0147077f649823002cb7ef7a0d40d6617c0fc699ee3b34337fcfb8ff82b1b01a');
          for(const x of r.candidateCorridors){
            if(x.found){
              assert.ok(x.pixelSteps>0);
              assert.equal(x.path.length,x.pixelSteps+1);
            }else assert.deepEqual(x.path,[]);
          }
          console.log('C1-Q held corridor evidence: '+
            r.candidateCorridors.map(x=>x.clearancePx+':'+x.found).join(', '));
          NODE
          node scripts/kaelvar-c1p-regional-seams.mjs --headland-svg > "$RUNNER_TEMP/c1q-headland-options.svg"
          test -s "$RUNNER_TEMP/c1q-headland-options.svg"
      - name: C1-R original-source pixel bottlenecks and wider corridor
        run: |
          node scripts/kaelvar-c1p-regional-seams.mjs --bottleneck-check > "$RUNNER_TEMP/c1r-bottleneck-report.json"
          node - "$RUNNER_TEMP/c1r-bottleneck-report.json" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(r.status,'C1R_HELD_ORIGINAL_PAIR_SOURCE_CORRIDOR_DIAGNOSTICS_ONLY');
          assert.equal(r.inputWitness.originalSourceEdges,599);
          assert.equal(r.inputWitness.mainlandCandidateCells,79419);
          assert.deepEqual(r.inputWitness.headlandSourceEdgesInclusive,[75,115]);
          assert.deepEqual(r.baselineConnectivity.map(x=>x.found),[true,false,false]);
          assert.equal(r.baselineConnectivity[0].pixelSteps,223);
          assert.equal(r.narrowRouteDiagnostics.zeroClearanceSteps,223);
          assert.equal(r.narrowRouteDiagnostics.sampledAlongZeroClearancePath,224);
          assert.ok(r.narrowRouteDiagnostics.samplesLackingOnePixelManhattanClearance>0);
          assert.deepEqual(r.widenedConnectivity.map(x=>x.clearancePx),[0,1,2]);
          assert.deepEqual(r.widenedConnectivity.map(x=>x.found),[true,false,false]);
          assert.equal(r.widenedConnectivity[0].pixelSteps,223);
          assert.equal(r.widenedConnectivity[0].pathSha256,
            '0147077f649823002cb7ef7a0d40d6617c0fc699ee3b34337fcfb8ff82b1b01a');
          assert.equal(r.narrowRouteDiagnostics.samplesLackingOnePixelManhattanClearance,72);
          assert.deepEqual(r.narrowRouteDiagnostics.adjacentRejectedPixelReasons,
            {SOURCE_PAIR_RGB_EQUALITY:96});
          assert.equal(r.narrowRouteDiagnostics.pathSampleRgbDiagnostics.sourceBlueRulePositive,0);
          assert.equal(r.narrowRouteDiagnostics.pathSampleRgbDiagnostics.sourcePairRgbEquality,0);
          const alt=r.alternateRouteWithAllC1QInteriorPathCellsExcluded;
          assert.equal(alt.found,true);
          assert.equal(alt.pixelSteps,225);
          assert.equal(alt.pathSha256,
            '8acf9d83cb43ac31d7085822fdd2e75859f71ffcbaa840700d2268ba8e8ee22b');
          assert.equal(r.paths.alternativeDisjoint.length,226);
          const primaryInterior=new Set(r.paths.c1q.slice(1,-1).map(p=>p.x+','+p.y));
          assert.equal(r.paths.alternativeDisjoint.slice(1,-1)
            .some(p=>primaryInterior.has(p.x+','+p.y)),false);
          assert.equal(r.paths.c1q.length,224);
          assert.equal(r.paths.expandedZero.length,r.widenedConnectivity[0].pixelSteps+1);
          for(const c of r.widenedConnectivity){
            if(c.found)assert.ok(c.pixelSteps>0);
            else assert.equal(c.pixelSteps,null);
          }
          assert.equal(r.immutableAllocation.C1PAssigned,52449);
          assert.equal(r.immutableAllocation.C1PUnassigned,26970);
          assert.equal(r.immutableAllocation.newlyAllocatedCells,0);
          assert.equal(r.immutableAllocation.otherTerrainComponentsClaimed,0);
          assert.equal(r.immutableAllocation.politicalHeadlandOwner,null);
          assert.equal(r.immutableAllocation.shattercapIslandClaims,0);
          assert.equal(r.immutableAllocation.canonicalWritable,false);
          assert.equal(r.interpretation.sourceRGBAndTerrainCandidatesAreNotCertifiedLandSea,true);
          console.log('C1-R widened connectivity '+
            r.widenedConnectivity.map(x=>x.clearancePx+':'+x.found).join(', '));
          console.log('C1-R independent interior-disjoint source candidate path: '+
            r.alternateRouteWithAllC1QInteriorPathCellsExcluded.found);
          NODE
          node scripts/kaelvar-c1p-regional-seams.mjs --bottleneck-svg > "$RUNNER_TEMP/c1r-bottleneck-comparison.svg"
          test -s "$RUNNER_TEMP/c1r-bottleneck-comparison.svg"
      - name: C1-S source-pair shared-ink sensitivity without territorial allocation
        run: |
          node scripts/kaelvar-c1p-regional-seams.mjs --ink-check > "$RUNNER_TEMP/c1s-ink-sensitivity.json"
          node - "$RUNNER_TEMP/c1s-ink-sensitivity.json" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(r.status,'C1S_UNCERTAIN_SHARED_SOURCE_INK_SENSITIVITY_ONLY_CANONICAL_HELD');
          assert.equal(r.inputWitness.sourceContourVertices,599);
          assert.deepEqual(r.inputWitness.protectedHeadlandSourceEdges,[75,115]);
          assert.equal(r.immutableC1P.mainlandTerrainCandidateCells,79419);
          assert.equal(r.immutableC1P.assigned,52449);
          assert.equal(r.immutableC1P.unassigned,26970);
          assert.deepEqual(r.immutableC1P.perRegion,[5632,18624,19182,9011]);
          assert.equal(r.immutableC1P.changedSourcePixels,0);
          assert.equal(r.immutableC1P.changedOriginalTerrainLabels,0);
          assert.equal(r.immutableC1P.newlyAssignedRegions,0);
          assert.equal(r.immutableC1P.detachedComponentsClaimed,0);
          assert.equal(r.immutableC1P.canonicalWritable,false);
          assert.equal(r.classification.eligibleTotal,
            Object.values(r.classification.eligibleUncertainReferenceSamples)
              .reduce((a,b)=>a+b,0));
          const ids=['ORIGINAL_SOURCE_PAIR_ONLY','HYPOTHETICAL_BLACK_ONLY',
            'HYPOTHETICAL_TEAL_ONLY','HYPOTHETICAL_BLACK_AND_TEAL',
            'HYPOTHETICAL_ALL_SHARED_NONBLUE'];
          assert.deepEqual(r.scenarios.map(x=>x.id),ids);
          assert.deepEqual(r.scenarios[0].clearance.map(x=>x.found),[true,false,false]);
          assert.equal(r.scenarios[0].clearance[0].pixelSteps,223);
          assert.equal(r.scenarios[0].clearance[0].pathSha256,
            '0147077f649823002cb7ef7a0d40d6617c0fc699ee3b34337fcfb8ff82b1b01a');
          assert.equal(r.scenarios[0].hypotheticalCandidateSamples,0);
          assert.deepEqual(r.classification.eligibleUncertainReferenceSamples,
            {black:2289,teal:173,other:351});
          assert.equal(r.classification.eligibleTotal,2813);
          assert.equal(r.classification.candidatePixelsAdjacentToOtherOriginalPhysicalComponents,31);
          assert.deepEqual(r.classification.neighboringOriginalNonMainlandComponentLabels,
            [51,78,113]);
          assert.deepEqual(r.scenarios.map(x=>x.hypotheticalCandidateSamples),
            [0,2289,173,2462,2813]);
          assert.deepEqual(r.scenarios.map(x=>x.clearance.map(c=>c.found)),[
            [true,false,false],
            [true,false,false],
            [true,true,false],
            [true,true,true],
            [true,true,true]
          ]);
          assert.equal(r.scenarios[2].clearance[1].pixelSteps,223);
          assert.equal(r.scenarios[2].clearance[1].pathSha256,
            '0cfbc0fac95776681b79b48d9903b73ee4c588a09e9526f268e06b801249c16b');
          assert.equal(r.scenarios[3].clearance[2].pixelSteps,223);
          assert.equal(r.scenarios[3].clearance[2].pathSha256,
            '3b8a527dbb6cbf835b4b123923b2f8e6fde72f509afba3783f498a9a12d20d25');
          assert.equal(r.scenarios[4].hypotheticalCandidateSamples,r.classification.eligibleTotal);
          for(const row of r.scenarios){
            assert.equal(row.originalMainlandLabelsChanged,0);
            assert.equal(row.actualTerritorialPixelsAssigned,0);
            assert.equal(row.noSourceOrPoliticalPublication,true);
            assert.equal(row.clearance.length,3);
            assert.equal(row.pathHypotheticalUnknownUsage.length,3);
            assert.equal(Object.values(row.hypotheticalByClass)
               .reduce((a,b)=>a+b,0),row.hypotheticalCandidateSamples);
          }
          assert.equal(r.limits.hypotheticalMasksAreNotCertifiedLandSea,true);
          console.log('C1-S conditional source-ink connectivity: '+
            r.scenarios.map(x=>x.id+' '+x.clearance.map(c=>c.found).join('/')).join('; '));
          NODE
          node scripts/kaelvar-c1p-regional-seams.mjs --ink-svg > "$RUNNER_TEMP/c1s-ink-sensitivity-preview.svg"
          test -s "$RUNNER_TEMP/c1s-ink-sensitivity-preview.svg"
      - name: C1-T verify one-pixel teal influence and detached physical component contacts
        run: |
          node scripts/kaelvar-c1p-regional-seams.mjs --pinch-check > "$RUNNER_TEMP/c1t-teal-and-detached-contacts.json"
          node - "$RUNNER_TEMP/c1t-teal-and-detached-contacts.json" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(r.status,'C1T_SOURCE_MICROMORPHOLOGY_AND_DETACHED_RISK_ONLY_NO_REGION_CHANGE');
          assert.deepEqual(r.focus.reference,{x:400,y:317});
          assert.deepEqual(r.focus.source,{x:837,y:675});
          assert.deepEqual(r.focus.rgb,[4,159,169]);
          assert.equal(r.focus.sharedNonblue,true);
          assert.deepEqual(r.focus.exactTealUnknownSamplesOnC1SOnePixelPath,[{x:400,y:317}]);
          assert.equal(r.focusPixelOneAtATime.originalTealSensitivity1px.found,true);
          assert.equal(r.detachedContactAudit.sourcePixelAdjacencySamples,31);
          assert.deepEqual(r.detachedContactAudit.eligibleUnresolvedSamples,{black:2289,teal:173,other:351});
          assert.deepEqual(Object.keys(r.detachedContactAudit.byOriginalPhysicalComponent),['51','78','113']);
          assert.equal(r.detachedContactAudit.sourceContactSamples.length,31);
          assert.deepEqual(r.detachedContactAudit.byClass,{black:31,teal:0,other:0});
          assert.deepEqual(Object.fromEntries(Object.entries(
             r.detachedContactAudit.byOriginalPhysicalComponent)
              .map(([key,x])=>[key,x.candidateSamples])),{'51':8,'78':12,'113':11});
          assert.equal(r.focusPixelOneAtATime.focusOnlyHypotheticalTeal1px.found,false);
          assert.equal(r.focusPixelOneAtATime.allTealExceptFocus1px.found,true);
          assert.equal(r.focusPixelOneAtATime.allTealExceptFocus1px.steps,223);
          assert.equal(r.focusPixelOneAtATime.allTealExceptFocus1px.hash,
            '47090514e4a31be6d14d6c60762c31bc2219118736cf026511cb6cfef86c6cd4');
          assert.deepEqual(r.localSourceNeighborhood.counts,
            {black:24,teal:12,other:1,strictCandidate:205,
             notShared:22,outsideContour:25});
          assert.deepEqual(r.detachedContactAudit.scenarios.map(x=>x.id),
            ['ORIGINAL_SOURCE_PAIR_ONLY','HYPOTHETICAL_TEAL_ONLY',
             'HYPOTHETICAL_BLACK_AND_TEAL','HYPOTHETICAL_ALL_SHARED_NONBLUE']);
          assert.deepEqual(r.detachedContactAudit.scenarios.map(x=>x.potentialPhysicalContactSamples),
            [0,0,22,22]);
          assert.deepEqual(r.detachedContactAudit.scenarios.map(x=>x.potentialPhysicalComponentLabels),
            [[],[],[51,78,113],[51,78,113]]);
          for(const c of r.detachedContactAudit.scenarios)
            assert.equal(c.actuallyMergedOrClaimedPhysicalComponents,0);
          assert.equal(r.noChanges.originalVectorEdges,599);
          assert.equal(r.noChanges.acceptedTerrainCandidateCells,79419);
          assert.equal(r.noChanges.acceptedC1PAssigned,52449);
          assert.equal(r.noChanges.acceptedC1PUnassigned,26970);
          assert.equal(r.noChanges.sourcePixelsChanged,0);
          assert.equal(r.noChanges.originalTerrainLabelsChanged,0);
          assert.equal(r.noChanges.polygonChanges,0);
          assert.equal(r.noChanges.newHeadlandOwner,null);
          assert.equal(r.noChanges.detachedPhysicalComponentsClaimed,0);
          assert.equal(r.noChanges.canonicalWritable,false);
          assert.equal(r.limits.hypotheticalLandCannotBeCertifiedFromSharedRgb,true);
          console.log('C1-T focus one-pixel only '+r.focusPixelOneAtATime.focusOnlyHypotheticalTeal1px.found+
           ', teal excluding focus '+r.focusPixelOneAtATime.allTealExceptFocus1px.found);
          console.log('C1-T original component contact risks '+JSON.stringify(
           r.detachedContactAudit.scenarios.map(x=>[x.id,x.potentialPhysicalComponentLabels])));
          NODE
          node scripts/kaelvar-c1p-regional-seams.mjs --pinch-svg > "$RUNNER_TEMP/c1t-teal-detached-contact-preview.svg"
          test -s "$RUNNER_TEMP/c1t-teal-detached-contact-preview.svg"
      - name: Upload review-only outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1p-noncanonical-native-terrain-review
          path: |
            ${{ runner.temp }}/c1p-native-review.json
            ${{ runner.temp }}/c1p-original-versus-refined.svg
            ${{ runner.temp }}/c1p-refined-north-coast.svg
            ${{ runner.temp }}/c1q-headland-review.json
            ${{ runner.temp }}/c1q-headland-options.svg
            ${{ runner.temp }}/c1r-bottleneck-report.json
            ${{ runner.temp }}/c1r-bottleneck-comparison.svg
            ${{ runner.temp }}/c1s-ink-sensitivity.json
            ${{ runner.temp }}/c1s-ink-sensitivity-preview.svg
            ${{ runner.temp }}/c1t-teal-and-detached-contacts.json
            ${{ runner.temp }}/c1t-teal-detached-contact-preview.svg
          if-no-files-found: warn
          retention-days: 7
