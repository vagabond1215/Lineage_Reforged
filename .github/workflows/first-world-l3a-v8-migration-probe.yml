name: First World L3a-L3b isolated World registry preflight

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/rpg-ui/src/game-shell/cleanEpochAccountStore.ts'
      - 'apps/rpg-ui/src/game-shell/firstWorldDurableRegistry.ts'
      - 'apps/rpg-ui/chronicle-world-registry-qa.html'
      - 'apps/rpg-ui/tests/first-world-l3b-real-browser-qa.mjs'
      - 'tests/unit/first-world-l3a-v8-migration.test.mjs'
      - '.github/workflows/first-world-l3a-v8-migration-probe.yml'

permissions:
  contents: read

jobs:
  synthetic-world-registry:
    runs-on: ubuntu-24.04  # Playwright 1.56.1 Chromium runner support; ubuntu-latest is now 26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test-only TypeScript loader and IndexedDB emulator
        run: npm install --no-save --ignore-scripts --package-lock=false tsx@4.20.6 fake-indexeddb@6.2.5 playwright@1.56.1
      - name: Run v8 migration and source World genesis contract tests
        run: |
          node --import tsx --test \
            tests/unit/first-world-l3a-v8-migration.test.mjs \
            tests/unit/first-world-creation-contract.test.mjs \
            tests/unit/starfall-world-template.test.mjs \
            tests/unit/starfall-base-economy.test.mjs
      - name: Preserve coordinate-first no-legacy-dependency gate
        run: npm run tool:no-new-hex-dependencies
      - name: Install existing UI TypeScript toolchain without lifecycle scripts
        run: npm --prefix apps/rpg-ui ci --ignore-scripts
      - name: Typecheck node-owned epoch persistence sources
        run: npm --prefix apps/rpg-ui run typecheck:node
      - name: Provision disposable Chromium runner only
        run: npx playwright install --with-deps chromium
      - name: Materialize exact master v7 owner for browser comparison only
        run: |
          git show aae4d65cdc65482032d62acef74316ed59c1eacf:apps/rpg-ui/src/game-shell/cleanEpochAccountStore.ts > apps/rpg-ui/src/game-shell/cleanEpochAccountStoreV7Qa.ts
          grep -q 'CLEAN_EPOCH_DATABASE_VERSION = 7;' apps/rpg-ui/src/game-shell/cleanEpochAccountStoreV7Qa.ts
          git status --short -- apps/rpg-ui/src/game-shell/cleanEpochAccountStoreV7Qa.ts
      - name: Real Chromium v7 to v8 migration and read-only World graph QA
        run: node --import tsx apps/rpg-ui/tests/first-world-l3b-real-browser-qa.mjs
      - name: Do not activate the v8 migration in the default launcher
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const shell=fs.readFileSync('apps/rpg-ui/src/EpochApp.tsx','utf8');
          const migration=fs.readFileSync('apps/rpg-ui/src/game-shell/cleanEpochAccountStore.ts','utf8');
          assert.match(migration,/CLEAN_EPOCH_DATABASE_VERSION = 8;/);
          assert.match(migration,/async createChronicleWorld/);
          assert.match(migration,/assertRetainedWorldGraph/);
          assert.match(shell,/welcomeL1/);
          console.log('PASS draft World registry source, no default UI activation patch');
          NODE
