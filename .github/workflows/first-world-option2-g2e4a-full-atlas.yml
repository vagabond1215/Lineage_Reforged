name: First World Option 2 G2-E4a full-source overview candidate

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-g2e4a-full-atlas.py'
      - '.github/workflows/first-world-option2-g2e4a-full-atlas.yml'
      - 'docs/design/first-world-option2-g2e3-owner-direction-record-2026-11-16.json'
  push:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-g2e4a-full-atlas.py'
      - '.github/workflows/first-world-option2-g2e4a-full-atlas.yml'

permissions:
  contents: read

jobs:
  full-source-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only image inspection libraries
        run: python -m pip install numpy opencv-python-headless
      - name: Compile and exercise synthetic topology gate
        run: |
          python -m py_compile scripts/first-world-option2-g2e4a-full-atlas.py
          python scripts/first-world-option2-g2e4a-full-atlas.py --self-test
      - name: Hash-verify and render complete source-derived macro overview
        run: |
          python scripts/first-world-option2-g2e4a-full-atlas.py \
            --source-dir packages/content/base/world/map_assets/first_world_simulator_option2_2026_11_15 \
            --owner-ledger docs/design/first-world-option2-g2e3-owner-direction-record-2026-11-16.json \
            --output-dir "$RUNNER_TEMP/g2e4a-full-world"
      - name: Fail closed on published-geometry claims or missing preview files
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'g2e4a-full-world'
          ledger=json.loads((out/'full_world_atlas_preview_report.json').read_text())
          assert ledger['schemaVersion']==1
          assert ledger['status']=='G2E4A_ORIGINAL_SOURCE_FULL_WORLD_DISPLAY_CANDIDATES_NOT_CANONICAL'
          assert len(ledger['ownerG2E3DirectionsIncluded'])==9
          for name in ('canonicalWritable','previewOnlyCoordinateRegistrationApproved','majorPhysicalIslandIDsCertified','V1TidalFootRouteAuthorized','ecologyOrResourceSpawnPublished','politicalSovereigntyApproved','localMapSquaresGenerated','classifiersSemanticallyIndependent','nativeSimulatorMeshRecovered'):
              assert ledger[name] is False, name
          for name in ('shore_detail.png','atlas_clarity.png','review_windows.png'):
              assert (out/name).stat().st_size>10000, name
          print('PASS full 16K LFS source only, no geometry/travel/ecology promotion')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: first-world-g2e4a-complete-preview-only
          path: |
            ${{ runner.temp }}/g2e4a-full-world/*.png
            ${{ runner.temp }}/g2e4a-full-world/full_world_atlas_preview_report.json
          retention-days: 21
