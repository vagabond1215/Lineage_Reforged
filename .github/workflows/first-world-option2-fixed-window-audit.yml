name: First World Option 2 fixed-window source audit

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-fixed-window-audit.py'
      - 'docs/design/first-world-option2-fixed-window-coast-audit-2026-11-16.json'
      - 'tests/unit/first-world-option2-fixed-window-coast.test.mjs'
      - '.github/workflows/first-world-option2-fixed-window-audit.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-fixed-window-audit.py'
      - 'docs/design/first-world-option2-fixed-window-coast-audit-2026-11-16.json'
      - 'tests/unit/first-world-option2-fixed-window-coast.test.mjs'
      - '.github/workflows/first-world-option2-fixed-window-audit.yml'

permissions:
  contents: read

jobs:
  fixed-window-source-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source without full-resolution LFS media
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Python 3.12 for isolated review tool
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only image audit dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Compile the reviewed Python audit script
        run: python -m py_compile scripts/first-world-option2-fixed-window-audit.py
      - name: Synthetic coastal identity and displacement checks
        run: python scripts/first-world-option2-fixed-window-audit.py --self-test
      - name: Node 22 for source-evidence contract check
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate evidence integrity and noncanonical gates
        run: node --test tests/unit/first-world-option2-fixed-window-coast.test.mjs
