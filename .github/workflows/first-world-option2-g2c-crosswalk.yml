name: First World Option 2 G2-C native render correspondence

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-g2c-crosswalk.py'
      - 'docs/design/first-world-option2-g2c-native-classifier-correspondence-2026-11-16.json'
      - 'tests/unit/first-world-option2-g2c-crosswalk.test.mjs'
      - '.github/workflows/first-world-option2-g2c-crosswalk.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-g2c-crosswalk.py'
      - 'docs/design/first-world-option2-g2c-native-classifier-correspondence-2026-11-16.json'
      - 'tests/unit/first-world-option2-g2c-crosswalk.test.mjs'
      - '.github/workflows/first-world-option2-g2c-crosswalk.yml'

permissions:
  contents: read

jobs:
  g2c-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout and hydrate original 16K source images
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit-only dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Compile exact crosswalk implementation
        run: python -m py_compile scripts/first-world-option2-g2c-crosswalk.py
      - name: Exercise synthetic split and identity
        run: python scripts/first-world-option2-g2c-crosswalk.py --self-test
      - name: Run original native 16K G2-C correspondence audit
        run: |
          python scripts/first-world-option2-g2c-crosswalk.py \
            --source-dir packages/content/base/world/map_assets/first_world_simulator_option2_2026_11_15 \
            --output-dir "$RUNNER_TEMP/first-world-g2c"
      - name: Verify exact native classification and full original source overlap
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"first-world-g2c/g2c_crosswalk_summary.json"
          report=json.loads(p.read_text())
          assert report["status"]=="SEMANTIC_LAND_AUTHORITY_HELD"
          assert report["canonicalWritable"] is False
          assert report["nativeSemanticLandMaskRecovered"] is False
          assert report["comparison"]=={
            "sourceCropPixels":142118144,
            "AOnlyLandPixels":44716,
            "BOnlyLandPixels":0,
            "AlandPixels":36095836,
            "BlandPixels":36051120,
          }
          s4,s8=report["crosswalks"]
          for s,conn,na,nb,stable,blabels in [
            (s4,4,169,171,138,[1,37,60]),
            (s8,8,161,163,130,[1,36,59])
          ]:
            assert (s["connectivity"],s["AComponents"],s["BComponents"])==(conn,na,nb)
            assert (s["AUnmatched"],s["BUnmatched"],s["ASplit"],s["BFuse"])==(0,0,1,0)
            assert s["AStable99PctOneToOne"]==stable
            assert len(s["splitRecords"])==1
            split=s["splitRecords"][0]
            assert split["ephemeralA"]==1
            assert [b["ephemeralB"] for b in split["matchedB"]]==blabels
            assert [b["overlapPixels"] for b in split["matchedB"]]==[16963893,2916,3169]
          print("PASS native Valtherion rendered split, source images and semantic authority hold")
          PY
      - name: Upload source-only component crosswalk review evidence
        uses: actions/upload-artifact@v4
        with:
          name: first-world-g2c-rendered-correspondence-source-only
          path: |
            ${{ runner.temp }}/first-world-g2c/g2c_crosswalk_summary.json
            ${{ runner.temp }}/first-world-g2c/g2c_crosswalk_ledger.json
          retention-days: 14
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source authority hold contract
        run: node --test tests/unit/first-world-option2-g2c-crosswalk.test.mjs
