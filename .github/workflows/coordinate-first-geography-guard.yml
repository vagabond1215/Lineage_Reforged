name: Coordinate-first geography guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, connector/c1-coordinate-geography-registry-2026-11-13, connector/c1f-kaelvar-placement-revision-2026-11-13, connector/c1g-kaelvar-coastal-salt-basin-evidence-2026-11-13]

permissions:
  contents: read

jobs:
  forbid-new-hex-coupling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for frozen legacy baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze legacy hex coupling
        run: node scripts/check-no-new-hex-dependencies.mjs --check
      - name: Coordinate-first geometry, Kaelvar semantic zones and gate tests
        run: node --test tests/unit/world-coordinate-geometry.test.mjs tests/unit/legacy-hex-forward-gate.test.mjs tests/unit/kaelvar-five-region-candidate-audit.test.mjs
      - name: Review-only locality and ecology integrity
        run: node scripts/kaelvar-five-region-candidate-audit.mjs --check
      - name: C1 coordinate registry, whole-component holds and original-source audit
        run: |
          node --check scripts/lib/world-source-git-witness.mjs
          node --check tests/unit/world-source-git-witness.test.mjs
          node --test tests/unit/world-source-git-witness.test.mjs
          node --check scripts/lib/world-geographic-authority.mjs
          node --check scripts/kaelvar-c1-geography-review.mjs
          node --check tests/unit/world-geographic-authority.test.mjs
          node --test tests/unit/world-geographic-authority.test.mjs
          node scripts/kaelvar-c1-geography-review.mjs --check

      - name: C1-F source-pair clipped placement preview and island holds
        run: |
          node --check scripts/lib/kaelvar-c1f-source-png.mjs
          node --check scripts/lib/kaelvar-c1f-source-raster.mjs
          node --check scripts/lib/kaelvar-c1f-placement-intent.mjs
          node --check scripts/kaelvar-c1f-placement-preview.mjs
          node --test tests/unit/kaelvar-c1f-placement-intent.test.mjs
          node scripts/kaelvar-c1f-placement-preview.mjs --report | tee "$RUNNER_TEMP/kaelvar-c1f-report.json"
          node scripts/kaelvar-c1f-placement-preview.mjs --svg > "$RUNNER_TEMP/kaelvar-c1f-review.svg"
          test -s "$RUNNER_TEMP/kaelvar-c1f-review.svg"
      - name: Publish C1-F noncanonical comparison for visual review
        uses: actions/upload-artifact@v4
        with:
          name: kaelvar-c1f-noncanonical-source-review
          path: |
            ${{ runner.temp }}/kaelvar-c1f-review.svg
            ${{ runner.temp }}/kaelvar-c1f-report.json
          retention-days: 7

      - name: C1-G coast and inland salt basin narrative gates
        run: |
          node --check scripts/lib/kaelvar-c1g-ecology-evidence.mjs
          node --check scripts/kaelvar-c1g-ecology-review.mjs
          node --check tests/unit/kaelvar-c1g-ecology-evidence.test.mjs
          node --test tests/unit/kaelvar-c1g-ecology-evidence.test.mjs
          node scripts/kaelvar-c1g-ecology-review.mjs --check

      - name: C1-H source adjacency and raw elevation diagnostics (not certified hydrology)
        run: |
          node --check scripts/lib/kaelvar-c1h-source-diagnostics.mjs
          node --check scripts/kaelvar-c1h-source-review.mjs
          node --check tests/unit/kaelvar-c1h-source-diagnostics.test.mjs
          node --test tests/unit/kaelvar-c1h-source-diagnostics.test.mjs
          node scripts/kaelvar-c1h-source-review.mjs --check | tee "$RUNNER_TEMP/kaelvar-c1h-diagnostic.json"
          node scripts/kaelvar-c1h-source-review.mjs --svg > "$RUNNER_TEMP/kaelvar-c1h-source-review.svg"
          test -s "$RUNNER_TEMP/kaelvar-c1h-source-review.svg"
      - name: Publish source evidence for review, never canonical
        uses: actions/upload-artifact@v4
        with:
          name: kaelvar-c1h-source-evidence-not-certified-hydrology
          path: |
            ${{ runner.temp }}/kaelvar-c1h-diagnostic.json
            ${{ runner.temp }}/kaelvar-c1h-source-review.svg
          retention-days: 7
