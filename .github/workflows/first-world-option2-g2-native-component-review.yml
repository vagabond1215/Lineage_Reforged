name: First World Option 2 G2 native component review

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-g2-component-audit.py'
      - 'docs/design/first-world-option2-g2-native-physical-component-review-2026-11-16.*'
      - 'tests/unit/first-world-option2-g2-evidence.test.mjs'
      - '.github/workflows/first-world-option2-g2-native-component-review.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/first-world-option2-g2-component-audit.py'
      - 'docs/design/first-world-option2-g2-native-physical-component-review-2026-11-16.*'
      - 'tests/unit/first-world-option2-g2-evidence.test.mjs'
      - '.github/workflows/first-world-option2-g2-native-component-review.yml'

permissions:
  contents: read

jobs:
  source-only-native-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout and hydrate original 16K Git LFS PNGs
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Use Python 3.12 for reproducible review
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image analysis dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Compile source audit
        run: python -m py_compile scripts/first-world-option2-g2-component-audit.py
      - name: Synthetic 4/8-connected preflight
        run: python scripts/first-world-option2-g2-component-audit.py --self-test
      - name: Run full-resolution 16K source audit without repository writes
        run: |
          python scripts/first-world-option2-g2-component-audit.py \
            --source-dir packages/content/base/world/map_assets/first_world_simulator_option2_2026_11_15 \
            --output-dir "$RUNNER_TEMP/g2-first-world-native-evidence"
      - name: Check exact native witnesses and hold status
        env:
          OUT: ${{ runner.temp }}/g2-first-world-native-evidence/g2_component_audit_summary.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ['OUT']).read_text())
          assert p['status']=='G2_AMBIGUITY_HELD'
          assert p['canonicalWritable'] is False and p['simulatorMeshRecovered'] is False
          assert p['renderedOceanPixelsA']==106022308
          assert p['renderedOceanPixelsB']==106067024
          assert p['ABDisagreementPixels']==44716
          assert p['BiomeHeightBlueVoteDisagreementPixels']==0
          base={(x['classifier'],x['connectivity'],x['erosionCrossIterations']):x
                for x in p['sensitivity']}
          assert base[('A_exact_state_ocean',4,0)]['componentCount']==169
          assert base[('A_exact_state_ocean',8,0)]['componentCount']==161
          assert base[('B_dual_layer_chromatic',4,0)]['componentCount']==171
          assert base[('B_dual_layer_chromatic',8,0)]['componentCount']==163
          assert len(base)==10
          assert all(x['draemorTalmyraConnected'] is True for x in base.values())
          print('PASS full native-source G2 reproducibility; geometry adoption remains HELD')
          PY
      - name: Use Node 22 for evidence-contract test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence integrity and forbidden geography promotions
        run: node --test tests/unit/first-world-option2-g2-evidence.test.mjs
